<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Guesser</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel photo-panel">
        <h1>Campus Guesser</h1>
        <p>Guess where this photo was taken on your school map.</p>
        <div class="photo-frame">
          <img id="round-photo" src="" alt="Current round photo" />
        </div>
        <div class="photo-controls" aria-label="Photo framing controls">
          <label for="photo-zoom">Zoom</label>
          <input id="photo-zoom" type="range" min="1.4" max="3.2" step="0.1" value="2.4" />

          <label for="photo-pan-x">Pan X</label>
          <input id="photo-pan-x" type="range" min="0" max="100" step="1" value="50" />

          <label for="photo-pan-y">Pan Y</label>
          <input id="photo-pan-y" type="range" min="0" max="100" step="1" value="50" />
        </div>
        <div class="actions">
          <button id="open-map" class="open-map">Open map to place guess</button>
          <button id="submit-guess" disabled>Submit guess</button>
          <button id="next-round">Next round</button>
        </div>
        <p id="result"></p>
      </section>
      <section class="panel map-panel hidden" id="map-panel" aria-hidden="true">
        <button id="close-map" class="close-map">Close map</button>
        <div id="map"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
